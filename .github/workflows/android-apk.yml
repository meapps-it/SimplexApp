name: SimplexApp Android APK
on:
  push:
    branches: [main, feature/simplexapp-android]
    paths: ['android-native/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build unsigned release
        run: gradle -p android-native testReleaseUnitTest lintRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SimplexApp-1.0.0-unsigned
          path: |
            android-native/app/build/outputs/apk/release/*.apk
            android-native/app/build/reports/lint-results-release.html
            android-native/app/build/test-results/testReleaseUnitTest/*.xml
          if-no-files-found: error
