<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d304d">
  <title>SimplexApp · Sito in manutenzione</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf4fa;color:#0d304d;font:1rem/1.6 system-ui,sans-serif}
    main{box-sizing:border-box;width:min(92%,32rem);padding:clamp(1.5rem,6vw,3rem);border:1px solid #c9dcec;border-radius:1.25rem;background:white;text-align:center}
    h1{line-height:1.2;margin:.4em 0}
    a{display:inline-block;margin-top:.6rem;padding:.65rem 1rem;border-radius:.65rem;background:#125889;color:#fff;font-weight:700}
    a:focus-visible{outline:3px solid #0d304d;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <strong>SimplexApp</strong>
    <h1>Sito in manutenzione</h1>
    <p>Stiamo aggiornando il sito. Il catalogo Shop &amp; Parallelo è disponibile.</p>
    <a href="/shop/">Apri il catalogo</a>
  </main>
</body>
</html>
